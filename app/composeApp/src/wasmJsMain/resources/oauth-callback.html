<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self';" />
  <title>RosaFiesta - Autenticación</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFDFC;
      color: #2D2624;
      display: flex;
      min-height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #F2D8DB;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #6E625E; margin: 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Completando inicio de sesión</h1>
    <p>Puedes cerrar esta ventana si no se cierra automáticamente.</p>
  </main>
  <script type="application/javascript" src="oauth-callback.js"></script>
</body>
</html>
