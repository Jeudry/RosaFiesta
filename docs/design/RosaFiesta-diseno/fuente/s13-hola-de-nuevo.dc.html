<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sesión iniciada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .btn{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rf .bp{background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7)}
.rf .card{background:#fff;border-radius:22px;box-shadow:0 0 0 1px #F2EDF5,0 12px 28px -20px rgba(200,80,170,.4)}
.rf .mut{color:#62627A}
.rf .tag{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:700;white-space:nowrap}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="position:absolute;top:84px;left:24px;right:24px;display:flex;flex-direction:column;gap:6px">
    <div style="width:64px;height:64px;border-radius:50%;background:#FDE6F2;color:#C2338F;display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:12px" class="d">C</div>
    <h1 class="d" style="font-size:30px;font-weight:800;line-height:1.04">¡Hola de nuevo, Camila!</h1>
    <p class="mut" style="font-size:15px">camila.rodriguez@correo.com</p>
  </div>

  <section class="card" style="position:absolute;top:290px;left:20px;right:20px;padding:8px 8px 8px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px">
      <h2 class="d" style="font-size:20px;font-weight:800">Tus eventos</h2>
      <span class="mut" style="font-size:14px">3 activos</span>
    </div>
    <sc-for list="{{events}}" as="e" hint-placeholder-count="3">
      <button style="width:100%;display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;min-height:76px">
        <div style="width:52px;height:56px;border-radius:14px;background:{{e.tint}};display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none">
          <span class="d" style="font-size:21px;font-weight:800;line-height:1">{{e.day}}</span>
          <span style="font-size:11px;font-weight:700;letter-spacing:.06em">{{e.mon}}</span>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <p class="one" style="font-size:15px;font-weight:700">{{e.name}}</p>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="tag" style="background:{{e.sbg}};color:{{e.sfg}}">{{e.status}}</span>
            <span class="mut" style="font-size:13px">{{e.rel}}</span>
          </div>
        </div>
        <span class="mut"><dc-import name="Icon" k="chev-r" s="20" hint-size="20px,20px"></dc-import></span>
      </button>
    </sc-for>
  </section>

  <button class="btn bp" style="position:absolute;left:24px;right:24px;bottom:40px">Continuar al inicio</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      events: [
        { day: '23', mon: 'OCT', name: 'Boda Real Rosa & Dorado', status: 'Por pagar', sbg: '#FFF2C9', sfg: '#7A5700', tint: '#FDE6F2', rel: 'en 3 días' },
        { day: '2', mon: 'NOV', name: 'Quinceañera Valentina Crystal', status: 'Confirmado', sbg: '#EEF6D6', sfg: '#4E6A10', tint: '#EFE8FD', rel: 'en 13 días' },
        { day: '9', mon: 'NOV', name: 'Baby Shower Sofía en Rosas', status: 'Borrador', sbg: '#F1EFF5', sfg: '#62627A', tint: '#DDF4F3', rel: 'en 20 días' }
      ]
    };
  }
}
</script>
</body>
</html>
