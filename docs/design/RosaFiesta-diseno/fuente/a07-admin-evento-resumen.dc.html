<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin · Nuevo evento (resumen)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#151729;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf a{color:inherit;text-decoration:none}
.rf input,.rf textarea{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1;resize:none}
.rf .mut{color:#5F6377}
.rf .cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F6377}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #ECECF5,0 8px 20px -14px rgba(70,80,180,.45);flex:none;color:#151729}
.rf .card{background:#fff;border-radius:20px;box-shadow:0 0 0 1px #ECECF5,0 12px 28px -22px rgba(70,80,180,.45)}
.rf .btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rf .bp{background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;box-shadow:0 12px 24px -12px rgba(91,108,240,.75)}
.rf .bs{background:#fff;color:#151729;box-shadow:0 0 0 1px #E3E4EF}
.rf .chip{height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#fff;box-shadow:0 0 0 1px #E9E9F2;white-space:nowrap;flex:none}
.rf .on{background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;box-shadow:0 8px 16px -8px rgba(91,108,240,.7)}
.rf .tag{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf .fld{height:50px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #E3E4EF;display:flex;align-items:center;gap:10px;padding:0 14px;color:#5F6377;font-size:15px}
.rf .lbl{font-size:13px;font-weight:700;color:#3A3D52}
.rf .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.rf .stp{display:flex;align-items:center;gap:2px;height:34px;border-radius:999px;background:#F2F2F8;padding:0 3px;flex:none}
.rf .stp button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#5B6CF0}
.rf .seg{height:5px;border-radius:3px;flex:1}
.rf .sg{flex:1;height:38px;border-radius:12px;font-size:14px;font-weight:600;display:grid;place-items:center;color:#5F6377}
.rf .sg.sel{background:#fff;color:#151729;font-weight:700;box-shadow:0 2px 8px -3px rgba(70,80,180,.3)}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 100% 0%,#E6E7FF 0%,rgba(230,231,255,0) 60%),radial-gradient(80% 35% at 0% 12%,#F1E9FB 0%,rgba(241,233,251,0) 60%),#F6F6FB">
  <div style="padding:54px 20px 0;display:flex;flex-direction:column;gap:12px">
    <header style="display:flex;align-items:center;gap:12px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <div style="flex:1;min-width:0"><h1 class="d one" style="font-size:20px;font-weight:800;line-height:1.1">Resumen</h1><p class="mut one" style="font-size:13px">Paso 3 de 3</p></div>
      
    </header>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;gap:4px"><span class="seg" style="background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%)"></span><span class="seg" style="background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%)"></span><span class="seg" style="background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%)"></span></div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));font-size:12px;font-weight:600" class="mut"><span style="">Datos</span><span style="">Artículos</span><span style="color:#4B47D6;font-weight:700">Resumen</span></div>
    </div>
    <section style="border-radius:22px;background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 55%,#2FB8C8 100%);color:#fff;padding:16px;position:relative;overflow:hidden;box-shadow:0 18px 34px -20px rgba(80,110,230,.8)">
      <div style="position:absolute;right:-12px;top:-10px;opacity:.95"><dc-import name="Illo" k="cumple" w="110" h="110" hint-size="110px,110px"></dc-import></div>
      <p class="d" style="position:relative;font-size:20px;font-weight:800;max-width:220px">Cumpleaños de Mateo</p>
      <p style="position:relative;font-size:13px;color:#E9EEFF;margin-top:4px">Sáb 7 nov · 4:00 p. m. · 40 invitados</p>
      <p style="position:relative;font-size:13px;color:#E9EEFF;margin-top:2px;display:flex;align-items:center;gap:6px"><dc-import name="Icon" k="user" s="14" hint-size="14px,14px"></dc-import>Laura Peña</p>
    </section>
    <section class="card" style="padding:6px 16px 14px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;box-shadow:{{it.line}}">
          <dc-import name="Foto" k="{{it.k}}" w="34" h="34" r="10" hint-size="34px,34px"></dc-import>
          <span class="one" style="flex:1;font-weight:600">{{it.name}} <span class="mut" style="font-weight:500">× {{it.q}}</span></span>
          <span style="font-weight:700">RD$ {{it.t}}</span>
        </div>
      </sc-for>
      <div style="height:1px;background:#F0F0F6;margin:6px 0 10px"></div>
      <div style="display:flex;justify-content:space-between;font-size:14px" class="mut"><span>Transporte e instalación</span><span>RD$ 250</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px"><span style="font-size:15px;font-weight:700">Total</span><span class="d" style="font-size:24px;font-weight:800">RD$ 780</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:13px"><span class="mut">Anticipo para reservar (30%)</span><b style="color:#4B47D6">RD$ 234</b></div>
    </section>
    <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #E3E4EF">
      <span class="ti" style="width:36px;height:36px;background:#EEF6D6;color:#4E6A10"><dc-import name="Icon" k="wa" s="18" hint-size="18px,18px"></dc-import></span>
      <span style="flex:1;font-size:14px;line-height:1.35"><b>Enviar cotización a Laura</b><br><span class="mut">Por WhatsApp, al crear el evento</span></span>
      <span role="switch" aria-checked="true" aria-label="Enviar cotización" style="width:50px;height:30px;border-radius:999px;background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff"></span></span>
    </div>
  </div>
  <div style="position:absolute;left:20px;right:20px;bottom:36px">
    <button class="btn bp" style="width:100%"><dc-import name="Icon" k="check" s="20" w="2.4" hint-size="20px,20px"></dc-import>Crear evento</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = '0 -1px 0 #F0F0F6';
    return {
      items: [
        { name: 'Silla Tiffany Cristal', q: '40', t: '160', k: 'silla-tiffany', line: 'none' },
        { name: 'Mesa redonda', q: '5', t: '125', k: 'mesa-redonda', line: L },
        { name: 'Arco de globos rosa', q: '1', t: '95', k: 'arco-rosa', line: L },
        { name: 'Mesa dulce temática', q: '1', t: '150', k: 'mesa-helados', line: L }
      ]
    };
  }
}
</script>
</body>
</html>
