<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rosa · Resumen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .mut{color:#62627A}
.rf .seg{height:5px;border-radius:3px;flex:1}
.rf .btn{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rf .r{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:58px}
.rf .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.rf .falta{height:24px;padding:0 9px;border-radius:999px;background:#FFF2C9;color:#7A5700;font-size:12px;font-weight:700;display:flex;align-items:center}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:linear-gradient(180deg,#DED5F7 0%,#F2EAF7 40%,#F5EEF7 60%,#D9D0F2 100%)">
  <header style="position:absolute;top:54px;left:16px;right:16px;display:flex;align-items:center;gap:12px">
    <button class="ib" aria-label="Volver al paso anterior"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
      <p style="font-size:13px;font-weight:700">Paso 6 de 6</p>
      <div style="width:150px;display:flex;gap:4px">
        <span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span>
      </div>
    </div>
    <button class="ib" aria-label="Mi evento, 17 artículos" style="position:relative"><dc-import name="Icon" k="bag" s="22" hint-size="22px,22px"></dc-import><span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:#FFD45C;color:#2E1A47;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px">17</span></button>
  </header>

  <div style="position:absolute;top:128px;left:20px;right:20px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <dc-import name="Rosa" s="40" glow="{{false}}" hint-size="40px,40px"></dc-import>
      <h1 class="d" style="font-size:26px;font-weight:800;line-height:1.05">Listo. Revisa que todo esté bien</h1>
    </div>
    <section style="background:#fff;border-radius:24px;box-shadow:0 14px 30px -22px rgba(170,70,160,.45);padding:4px 0">
      <div class="r"><span class="ic" style="background:#FDE6F2;color:#C2338F"><dc-import name="Icon" k="ring" s="18" hint-size="18px,18px"></dc-import></span><span class="mut" style="flex:1;font-size:15px">Evento</span><b style="font-size:15px">Boda</b></div>
      <div class="r" style="box-shadow:0 -1px 0 #F2F0F5"><span class="ic" style="background:#DDF4F3;color:#1F8A84"><dc-import name="Icon" k="calendar" s="18" hint-size="18px,18px"></dc-import></span><span class="mut" style="flex:1;font-size:15px">Fecha</span><span class="falta">Por confirmar</span></div>
      <div class="r" style="box-shadow:0 -1px 0 #F2F0F5"><span class="ic" style="background:#EEF6D6;color:#4E6A10"><dc-import name="Icon" k="pin" s="18" hint-size="18px,18px"></dc-import></span><span class="mut" style="flex:1;font-size:15px">Ubicación</span><span class="falta">Por confirmar</span></div>
      <button class="r" style="width:100%;box-shadow:0 -1px 0 #F2F0F5"><span class="ic" style="background:#FFF2C9;color:#7A5700"><dc-import name="Icon" k="bag" s="18" hint-size="18px,18px"></dc-import></span><span class="mut" style="flex:1;font-size:15px">Artículos</span><b style="font-size:15px">160</b><span class="mut"><dc-import name="Icon" k="chev-r" s="18" hint-size="18px,18px"></dc-import></span></button>
    </section>
    <p style="display:flex;gap:10px;font-size:14px;line-height:1.45;color:#3B3550"><span style="color:#7A4FD8;flex:none;margin-top:1px"><dc-import name="Icon" k="info" s="18" hint-size="18px,18px"></dc-import></span>El equipo de Rosa Fiesta revisa tu evento y te contacta con el precio final. No pagas nada todavía.</p>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:40px;display:flex;flex-direction:column;gap:6px">
    <button class="btn" style="background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7)">Solicitar cotización</button>
    <button class="btn" style="height:48px">Agregar algo más</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
