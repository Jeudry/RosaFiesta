<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modal · Reseñas del evento</title>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h2{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .mut{color:#62627A}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <dc-import name="s37-mis-eventos" hint-size="390px,844px"></dc-import>
  <div style="position:absolute;inset:0;background:rgba(30,20,50,.45)"></div>
  <section role="dialog" aria-label="Reseñas del evento" style="position:absolute;left:0;right:0;bottom:0;height:540px;background:#FAFAFC;border-radius:28px 28px 0 0;padding:12px 20px 34px;display:flex;flex-direction:column;gap:16px">
    <span style="align-self:center;width:40px;height:5px;border-radius:3px;background:#E3DCE8"></span>
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1">
        <h2 class="d" style="font-size:21px;font-weight:800;line-height:1.1">Reseñas</h2>
        <p class="mut" style="font-size:14px">Gala Corporativa Grupo Caribe</p>
      </div>
      <button aria-label="Cerrar" style="width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #EEE9F2;display:grid;place-items:center"><dc-import name="Icon" k="x" s="20" hint-size="20px,20px"></dc-import></button>
    </div>
    <article style="background:#fff;border-radius:20px;box-shadow:0 0 0 1px #F2EDF5;padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:40px;height:40px;border-radius:50%;background:#FFF2C9;color:#7A5700;display:grid;place-items:center;font-weight:800">A</span>
        <div style="flex:1">
          <p style="font-size:15px;font-weight:700">Anónimo</p>
          <div style="display:flex;gap:2px;color:#F7B500">
            <dc-import name="Icon" k="star" s="14" f="{{true}}" hint-size="14px,14px"></dc-import>
            <dc-import name="Icon" k="star" s="14" f="{{true}}" hint-size="14px,14px"></dc-import>
            <dc-import name="Icon" k="star" s="14" f="{{true}}" hint-size="14px,14px"></dc-import>
            <dc-import name="Icon" k="star" s="14" f="{{true}}" hint-size="14px,14px"></dc-import>
            <dc-import name="Icon" k="star" s="14" f="{{true}}" hint-size="14px,14px"></dc-import>
          </div>
        </div>
        <span class="mut" style="font-size:13px">19 oct</span>
      </div>
      <p style="font-size:15px;line-height:1.5">Excelente coordinación en nuestra Gala Corporativa. Todo el mobiliario llegó impecable.</p>
    </article>
    <button style="margin-top:auto;height:56px;border-radius:16px;background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px"><dc-import name="Icon" k="edit" s="20" hint-size="20px,20px"></dc-import>Escribir reseña</button>
  </section>
</div>
</x-dc>
