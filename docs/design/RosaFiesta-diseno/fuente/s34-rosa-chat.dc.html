<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rosa · Modo chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p{margin:0}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .mut{color:#62627A}
.rf .chip{height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:14px;font-weight:600;background:#F3F0FA;color:#3B3550;white-space:nowrap;flex:none}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:linear-gradient(180deg,#DED5F7 0%,#F2EAF7 40%,#F5EEF7 60%,#D9D0F2 100%)">
  <dc-import name="s26-rosa-tipo-evento" hint-size="390px,844px"></dc-import>
  <section aria-label="Escribir a Rosa" style="position:absolute;left:0;right:0;bottom:0;height:300px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -18px 40px -24px rgba(170,70,160,.45);padding:12px 20px 34px;display:flex;flex-direction:column;gap:14px">
    <span style="align-self:center;width:40px;height:5px;border-radius:3px;background:#E3DCE8"></span>
    <div style="display:flex;gap:8px;margin:0 -20px -18px;padding:2px 20px 14px;overflow:hidden">
      <button class="chip">Es para 120 personas</button>
      <button class="chip">En un jardín</button>
      <button class="chip">Rosa y dorado</button>
    </div>
    <label style="flex:1;display:flex">
      <textarea aria-label="Mensaje para Rosa" style="flex:1;font:inherit;font-size:18px;line-height:1.45;border:0;outline:0;resize:none;background:none;color:#1A1A2E;padding:0">Queremos algo íntimo en un jardín, con flores blancas y rosadas</textarea>
    </label>
    <div style="display:flex;align-items:center;gap:10px">
      <button aria-label="Adjuntar foto" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#62627A"><dc-import name="Icon" k="image" s="22" hint-size="22px,22px"></dc-import></button>
      <button aria-label="Cambiar a voz" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#62627A"><dc-import name="Icon" k="mic" s="22" hint-size="22px,22px"></dc-import></button>
      <button style="margin-left:auto;height:44px;padding:0 14px;font-size:15px;font-weight:600;color:#62627A">Descartar</button>
      <button aria-label="Enviar" style="width:52px;height:52px;border-radius:50%;background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7);display:grid;place-items:center"><dc-import name="Icon" k="send" s="22" hint-size="22px,22px"></dc-import></button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
