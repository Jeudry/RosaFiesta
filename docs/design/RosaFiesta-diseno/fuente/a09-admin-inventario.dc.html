<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin · Inventario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#151729;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf a{color:inherit;text-decoration:none}
.rf input,.rf textarea{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1;resize:none}
.rf .mut{color:#5F6377}
.rf .cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F6377}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #ECECF5,0 8px 20px -14px rgba(70,80,180,.45);flex:none;color:#151729}
.rf .card{background:#fff;border-radius:20px;box-shadow:0 0 0 1px #ECECF5,0 12px 28px -22px rgba(70,80,180,.45)}
.rf .btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rf .bp{background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;box-shadow:0 12px 24px -12px rgba(91,108,240,.75)}
.rf .bs{background:#fff;color:#151729;box-shadow:0 0 0 1px #E3E4EF}
.rf .chip{height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#fff;box-shadow:0 0 0 1px #E9E9F2;white-space:nowrap;flex:none}
.rf .on{background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;box-shadow:0 8px 16px -8px rgba(91,108,240,.7)}
.rf .tag{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf .fld{height:50px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #E3E4EF;display:flex;align-items:center;gap:10px;padding:0 14px;color:#5F6377;font-size:15px}
.rf .lbl{font-size:13px;font-weight:700;color:#3A3D52}
.rf .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.rf .stp{display:flex;align-items:center;gap:2px;height:34px;border-radius:999px;background:#F2F2F8;padding:0 3px;flex:none}
.rf .stp button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#5B6CF0}
.rf .seg{height:5px;border-radius:3px;flex:1}
.rf .sg{flex:1;height:38px;border-radius:12px;font-size:14px;font-weight:600;display:grid;place-items:center;color:#5F6377}
.rf .sg.sel{background:#fff;color:#151729;font-weight:700;box-shadow:0 2px 8px -3px rgba(70,80,180,.3)}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 100% 0%,#E6E7FF 0%,rgba(230,231,255,0) 60%),radial-gradient(80% 35% at 0% 12%,#F1E9FB 0%,rgba(241,233,251,0) 60%),#F6F6FB">
  <div style="padding:54px 20px 0;display:flex;flex-direction:column;gap:12px">
    <header style="display:flex;align-items:center;gap:10px">
      <div style="flex:1"><h1 class="d" style="font-size:24px;font-weight:800">Inventario</h1><p class="mut" style="font-size:13px">15 artículos · 6 categorías</p></div>
      <button class="ib" aria-label="Ver disponibilidad"><dc-import name="Icon" k="calendar" s="20" hint-size="20px,20px"></dc-import></button>
      <a href="a10-admin-articulo-nuevo.dc.html" aria-label="Agregar artículo" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(91,108,240,.7)"><dc-import name="Icon" k="plus" s="22" w="2.2" hint-size="22px,22px"></dc-import></a>
    </header>
    <label class="fld" style="padding-right:6px"><dc-import name="Icon" k="search" s="18" hint-size="18px,18px"></dc-import><input placeholder="Buscar artículo" aria-label="Buscar artículo"><button aria-label="Filtros" style="width:38px;height:38px;border-radius:10px;background:#ECEBFF;color:#4B47D6;display:grid;place-items:center"><dc-import name="Icon" k="sliders" s="18" hint-size="18px,18px"></dc-import></button></label>
    <div style="display:flex;gap:8px;margin:0 -20px -18px;padding:2px 20px 14px;overflow:hidden">
      <button class="chip on">Todos</button><button class="chip">Mobiliario</button><button class="chip">Floral</button><button class="chip">Globos</button><button class="chip">Mesa dulce</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
      <div style="padding:10px 12px;border-radius:16px;background:#EEF6D6"><p class="d" style="font-size:20px;font-weight:800;color:#3F560C">12</p><p style="font-size:12px;font-weight:600;color:#4E6A10">Disponibles</p></div>
      <div style="padding:10px 12px;border-radius:16px;background:#ECEBFF"><p class="d" style="font-size:20px;font-weight:800;color:#4B47D6">2</p><p style="font-size:12px;font-weight:600;color:#4B47D6">Reservados hoy</p></div>
      <div style="padding:10px 12px;border-radius:16px;background:#FDE3EA"><p class="d" style="font-size:20px;font-weight:800;color:#B42345">1</p><p style="font-size:12px;font-weight:600;color:#B42345">Stock bajo</p></div>
    </div>
    <section class="card">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;box-shadow:{{it.line}}">
          <dc-import name="Foto" k="{{it.k}}" w="54" h="54" r="12" hint-size="54px,54px"></dc-import>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <p class="one" style="font-size:15px;font-weight:700">{{it.name}}</p>
            <p class="mut" style="font-size:12px">{{it.stock}} · <b style="color:#151729">RD$ {{it.price}}</b>/día</p>
          </div>
          <span class="tag" style="background:{{it.bg}};color:{{it.fg}}">{{it.st}}</span>
        </div>
      </sc-for>
    </section>
  </div>
  <div style="position:absolute;left:0;bottom:0">
    <dc-import name="AdminBar" a="inventario" hint-size="390px,96px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = '0 -1px 0 #F0F0F6';
    const ok = { bg: '#EEF6D6', fg: '#4E6A10', st: 'Activo' };
    return {
      items: [
        Object.assign({ name: 'Silla Tiffany Cristal', stock: '120 unid.', price: '4', k: 'silla-tiffany', line: 'none' }, ok),
        Object.assign({ name: 'Mesa redonda', stock: '12 unid.', price: '25', k: 'mesa-redonda', line: L }, ok),
        Object.assign({ name: 'Centro de mesa floral', stock: '20 unid.', price: '35', k: 'centro-floral', line: L }, ok),
        Object.assign({ name: 'Arco de globos rosa', stock: '3 unid.', price: '95', k: 'arco-rosa', line: L }, ok),
        { name: 'Mesa dulce temática', stock: '2 unid.', price: '150', k: 'mesa-helados', line: L, bg: '#FDE3EA', fg: '#B42345', st: 'Stock bajo' }
      ]
    };
  }
}
</script>
</body>
</html>
