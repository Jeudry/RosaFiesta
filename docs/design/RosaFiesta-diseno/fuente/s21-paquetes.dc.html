<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paquetes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .card{background:#fff;border-radius:22px;box-shadow:0 0 0 1px #F2EDF5,0 12px 28px -20px rgba(200,80,170,.4)}
.rf .mut{color:#62627A}
.rf .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:18px">
    <header style="display:flex;align-items:center;gap:14px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <div>
        <h1 class="d" style="font-size:24px;font-weight:800;line-height:1.05">Paquetes</h1>
        <p class="mut" style="font-size:14px">Colecciones temáticas, listas para tu evento</p>
      </div>
    </header>
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{packs}}" as="p" hint-placeholder-count="4">
        <button class="card" style="display:flex;gap:14px;padding:10px;align-items:stretch;width:100%">
          <span style="width:116px;height:116px;border-radius:16px;background:{{p.bg}};display:grid;place-items:center;flex:none;position:relative">
            <dc-import name="Foto" k="{{p.k}}" w="116" h="116" r="16" hint-size="116px,116px"></dc-import>
          </span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:4px 4px 2px 0">
            <span style="align-self:flex-start;height:22px;padding:0 8px;border-radius:999px;background:#EEF6D6;color:#4E6A10;font-size:12px;font-weight:700;display:flex;align-items:center">Ahorra {{p.off}}</span>
            <span class="d" style="font-size:18px;font-weight:800;line-height:1.15">{{p.name}}</span>
            <span class="mut clamp" style="font-size:13px;line-height:1.4">{{p.desc}}</span>
            <span style="margin-top:auto;font-size:13px" class="mut">desde <b class="d" style="font-size:17px;color:#C2338F">RD$ {{p.price}}</b></span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      packs: [
        { name: 'Bodas Rosa', desc: 'Paquete romántico completo para bodas, con arco floral y centros de mesa.', price: '850', off: '15%', k: 'boda', bg: '#FDE6F2' },
        { name: 'Quinceañera Premium', desc: 'Paquete de lujo para quinceañeras con arco floral.', price: '1,200', off: '12%', k: 'quinceanera', bg: '#EFE8FD' },
        { name: 'Cumpleaños Infantil', desc: 'Kit completo para fiestas infantiles: globos, banner y más.', price: '450', off: '10%', k: 'cumple-infantil', bg: '#EEF6D6' },
        { name: 'Evento Corporativo', desc: 'Solución profesional para eventos empresariales.', price: '600', off: '8%', k: 'corporativo', bg: '#FFF2C9' }
      ]
    };
  }
}
</script>
</body>
</html>
