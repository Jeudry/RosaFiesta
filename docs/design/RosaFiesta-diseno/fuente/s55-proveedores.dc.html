<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proveedores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#151729;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf input{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1}
.rf input::placeholder{color:#5F6377}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #ECECF5,0 8px 20px -14px rgba(70,80,180,.4);flex:none;color:#151729}
.rf .mut{color:#5F6377}
.rf .act{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 100% 0%,#E6E7FF 0%,rgba(230,231,255,0) 60%),radial-gradient(80% 35% at 0% 12%,#F1E9FB 0%,rgba(241,233,251,0) 60%),#F6F6FB">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:16px">
    <header style="display:flex;align-items:center;gap:12px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <div style="flex:1"><h1 class="d" style="font-size:20px;font-weight:800;line-height:1.1">Proveedores</h1><p class="mut" style="font-size:13px">2 activos</p></div>
      <button aria-label="Nuevo proveedor" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(91,108,240,.7)"><dc-import name="Icon" k="plus" s="22" w="2.2" hint-size="22px,22px"></dc-import></button>
    </header>
    <label style="height:48px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #E3E4EF,0 8px 20px -16px rgba(70,80,180,.35);display:flex;align-items:center;gap:10px;padding:0 14px;color:#5F6377"><dc-import name="Icon" k="search" s="18" hint-size="18px,18px"></dc-import><input placeholder="Buscar proveedor"></label>
    <sc-for list="{{sup}}" as="s" hint-placeholder-count="2">
      <article style="border-radius:22px;background:#fff;box-shadow:0 0 0 1px #ECECF5;padding:16px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <span class="d" style="width:48px;height:48px;border-radius:14px;background:{{s.bg}};color:{{s.fg}};display:grid;place-items:center;font-size:20px;font-weight:800;flex:none">{{s.ini}}</span>
          <div style="flex:1;min-width:0">
            <p style="font-size:16px;font-weight:700;line-height:1.25">{{s.name}}</p>
            <p class="mut" style="font-size:14px">{{s.contact}}</p>
          </div>
          <button aria-label="Más opciones" style="width:36px;height:36px;display:grid;place-items:center;color:#5F6377"><dc-import name="Icon" k="more-v" s="20" w="2.6" hint-size="20px,20px"></dc-import></button>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <p style="flex:1;font-size:14px;font-weight:600">{{s.phone}}</p>
          <button class="act" aria-label="Llamar" style="background:#EDEDF5"><dc-import name="Icon" k="phone" s="18" hint-size="18px,18px"></dc-import></button>
          <button class="act" aria-label="WhatsApp" style="background:#EEF6D6;color:#4E6A10"><dc-import name="Icon" k="wa" s="18" hint-size="18px,18px"></dc-import></button>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sup: [
        { ini: 'F', name: 'Flores del Jarabacoa Premium', contact: 'Doña Carmen Polanco', phone: '+1 809 555 2201', bg: '#ECEBFF', fg: '#4B47D6' },
        { ini: 'C', name: 'Cristalería & Eventos Caribe', contact: 'Ing. Marcos Tavares', phone: '+1 809 555 2202', bg: '#DDF4F3', fg: '#1F8A84' }
      ]
    };
  }
}
</script>
</body>
</html>
