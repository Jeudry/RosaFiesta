<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Leads · Seguimientos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#151729;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #ECECF5,0 8px 20px -14px rgba(70,80,180,.4);flex:none;color:#151729}
.rf .mut{color:#5F6377}
.rf .tab{height:44px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#5F6377;white-space:nowrap;flex:none;text-decoration:none}
.rf .tab.on{color:#151729;font-weight:700;box-shadow:inset 0 -2.5px 0 #5B6CF0}
.rf .tag{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 100% 0%,#E6E7FF 0%,rgba(230,231,255,0) 60%),radial-gradient(80% 35% at 0% 12%,#F1E9FB 0%,rgba(241,233,251,0) 60%),#F6F6FB">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:12px">
    <header style="display:flex;align-items:center;gap:10px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <h1 class="d" style="font-size:20px;font-weight:800;flex:1">Leads</h1>
      <button class="ib" aria-label="Actualizar"><dc-import name="Icon" k="refresh" s="20" hint-size="20px,20px"></dc-import></button>
      <button aria-label="Nuevo seguimiento" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(91,108,240,.7)"><dc-import name="Icon" k="plus" s="22" w="2.2" hint-size="22px,22px"></dc-import></button>
    </header>
    <nav style="display:flex;gap:22px;box-shadow:inset 0 -1px 0 #E9E9F2;margin:0 -20px;padding:0 20px">
      <a class="tab" href="s64-leads-pipeline.dc.html">Pipeline</a>
      <a class="tab on" href="s65-leads-seguimientos.dc.html">Seguimientos</a>
      <a class="tab" href="s66-leads-estadisticas.dc.html">Estadísticas</a>
    </nav>
    <p style="font-size:15px;font-weight:700;margin-top:6px">Pendientes <span class="mut" style="font-weight:500">· 2</span></p>
    <sc-for list="{{items}}" as="i" hint-placeholder-count="2">
      <div style="display:flex;gap:14px;padding:16px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px #ECECF5">
        <button aria-label="Marcar como hecho" style="width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px #CDBFCB;flex:none"></button>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px">
          <p style="font-size:15px;font-weight:600;line-height:1.4">{{i.text}}</p>
          <span class="tag" style="background:#FDE3EA;color:#B42345;align-self:flex-start"><dc-import name="Icon" k="alert" s="14" hint-size="14px,14px"></dc-import>Vencido · 18 oct</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { text: 'Enviar catálogo actualizado de mobiliario cristal y flores.' },
        { text: 'Llamada de cierre con el departamento de compras.' }
      ]
    };
  }
}
</script>
</body>
</html>
