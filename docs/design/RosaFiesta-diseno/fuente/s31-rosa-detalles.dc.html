<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rosa · Detalles del evento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf input{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1}
.rf input::placeholder{color:#62627A}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .mut{color:#62627A}
.rf .seg{height:5px;border-radius:3px;flex:1}
.rf .btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rf .r{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:58px;color:#62627A;font-size:15px}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:linear-gradient(180deg,#DED5F7 0%,#F2EAF7 40%,#F5EEF7 60%,#D9D0F2 100%)">
  <header style="position:absolute;top:54px;left:16px;right:16px;display:flex;align-items:center;gap:12px">
    <button class="ib" aria-label="Volver al paso anterior"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
      <p style="font-size:13px;font-weight:700">Paso 5 de 6</p>
      <div style="width:150px;display:flex;gap:4px">
        <span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:#DDD3F3"></span>
      </div>
    </div>
    <button class="ib" aria-label="Mi evento, 17 artículos" style="position:relative"><dc-import name="Icon" k="bag" s="22" hint-size="22px,22px"></dc-import><span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:#FFD45C;color:#2E1A47;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px">17</span></button>
  </header>

  <div style="position:absolute;top:128px;left:20px;right:20px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <dc-import name="Rosa" s="40" glow="{{false}}" hint-size="40px,40px"></dc-import>
      <h1 class="d" style="font-size:26px;font-weight:800;line-height:1.05">Ahora, los detalles de tu evento</h1>
    </div>
    <form style="margin:0;background:#fff;border-radius:24px;box-shadow:0 14px 30px -22px rgba(170,70,160,.45)">
      <button type="button" class="r" style="width:100%"><dc-import name="Icon" k="calendar" s="20" hint-size="20px,20px"></dc-import><span style="flex:1">Fecha del evento</span><dc-import name="Icon" k="chev-r" s="18" hint-size="18px,18px"></dc-import></button>
      <label class="r" style="box-shadow:0 -1px 0 #F2F0F5"><dc-import name="Icon" k="users" s="20" hint-size="20px,20px"></dc-import><input placeholder="¿Cuántas personas?" inputmode="numeric"></label>
      <label class="r" style="box-shadow:0 -1px 0 #F2F0F5"><dc-import name="Icon" k="pin" s="20" hint-size="20px,20px"></dc-import><input placeholder="¿Dónde será?"></label>
      <label class="r" style="box-shadow:0 -1px 0 #F2F0F5;align-items:flex-start;padding-top:18px;min-height:86px"><dc-import name="Icon" k="file" s="20" hint-size="20px,20px"></dc-import><textarea placeholder="Cuéntame tu idea (opcional)" style="flex:1;font:inherit;border:0;outline:0;resize:none;background:none;height:50px;color:#1A1A2E"></textarea></label>
    </form>
    <button style="display:flex;align-items:center;gap:14px;padding:12px;border-radius:20px;background:#EFE8FD;width:100%">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 56 56" style="flex:none;border-radius:14px;background:#fff">
        <path d="M8 0V56M20 0V56M32 0V56M44 0V56M0 8H56M0 20H56M0 32H56M0 44H56" stroke="#EFE8FA" stroke-width="1"></path>
        <circle cx="17" cy="18" r="6" fill="none" stroke="#EA4EA9" stroke-width="2"></circle>
        <circle cx="38" cy="18" r="6" fill="none" stroke="#EA4EA9" stroke-width="2"></circle>
        <rect x="12" y="34" width="32" height="10" rx="2" fill="none" stroke="#865DEC" stroke-width="2"></rect>
      </svg>
      <span style="flex:1"><span style="display:block;font-size:16px;font-weight:700">Boceto de distribución</span><span class="mut" style="font-size:13px;line-height:1.35">Dibuja tu espacio y la IA te propone ejemplos</span></span>
      <span style="color:#7A4FD8"><dc-import name="Icon" k="chev-r" s="20" hint-size="20px,20px"></dc-import></span>
    </button>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:110px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
    <button class="btn" style="background:#fff">Más ideas</button>
    <button class="btn" style="background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7)">Ver resumen</button>
  </div>

  <label style="position:absolute;left:16px;right:16px;bottom:34px;height:58px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px #E7DEF5,0 12px 30px -20px rgba(170,70,160,.4);display:flex;align-items:center;gap:10px;padding:0 6px 0 20px">
    <input placeholder="O díctale los detalles a Rosa…" aria-label="Mensaje para Rosa">
    <button aria-label="Hablar con Rosa" style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(134,93,236,.7)"><dc-import name="Icon" k="mic" s="22" hint-size="22px,22px"></dc-import></button>
  </label>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
