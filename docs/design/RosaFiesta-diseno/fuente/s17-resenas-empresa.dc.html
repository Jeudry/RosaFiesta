<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reseñas de Rosa Fiesta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .btn{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rf .bp{background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7)}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .card{background:#fff;border-radius:22px;box-shadow:0 0 0 1px #F2EDF5,0 12px 28px -20px rgba(200,80,170,.4)}
.rf .mut{color:#62627A}
.rf .chip{height:38px;padding:0 15px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#fff;box-shadow:0 0 0 1px #EEE9F2;white-space:nowrap}
.rf .on{background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;box-shadow:0 8px 18px -8px rgba(134,93,236,.7)}
.rf .bar{height:6px;border-radius:3px;background:#F1EFF5;flex:1;overflow:hidden}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:18px">
    <header style="display:flex;align-items:center;gap:14px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <h1 class="d" style="font-size:20px;font-weight:800">Reseñas</h1>
    </header>

    <section class="card" style="padding:18px;display:flex;gap:20px;align-items:center">
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <p class="d" style="font-size:48px;font-weight:800;line-height:.9">5.0</p>
        <div style="display:flex;gap:2px;color:#F7B500">
          <dc-import name="Icon" k="star" s="16" f="{{true}}" hint-size="16px,16px"></dc-import>
          <dc-import name="Icon" k="star" s="16" f="{{true}}" hint-size="16px,16px"></dc-import>
          <dc-import name="Icon" k="star" s="16" f="{{true}}" hint-size="16px,16px"></dc-import>
          <dc-import name="Icon" k="star" s="16" f="{{true}}" hint-size="16px,16px"></dc-import>
          <dc-import name="Icon" k="star" s="16" f="{{true}}" hint-size="16px,16px"></dc-import>
        </div>
        <p class="mut" style="font-size:13px">2 reseñas</p>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px" class="mut">
        <div style="display:flex;align-items:center;gap:8px">5<span class="bar"><span style="display:block;height:100%;width:100%;background:#F7B500"></span></span></div>
        <div style="display:flex;align-items:center;gap:8px">4<span class="bar"></span></div>
        <div style="display:flex;align-items:center;gap:8px">3<span class="bar"></span></div>
        <div style="display:flex;align-items:center;gap:8px">2<span class="bar"></span></div>
        <div style="display:flex;align-items:center;gap:8px">1<span class="bar"></span></div>
      </div>
    </section>

    <div style="display:flex;gap:8px">
      <button class="chip on">Todas</button>
      <button class="chip">Verificadas · 0</button>
    </div>

    <sc-for list="{{reviews}}" as="r" hint-placeholder-count="2">
      <article class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:40px;height:40px;border-radius:50%;background:{{r.bg}};color:{{r.fg}};display:grid;place-items:center;font-weight:800">{{r.ini}}</span>
          <div style="flex:1">
            <p style="font-size:15px;font-weight:700">{{r.who}}</p>
            <div style="display:flex;gap:2px;color:#F7B500">
              <dc-import name="Icon" k="star" s="13" f="{{true}}" hint-size="13px,13px"></dc-import>
              <dc-import name="Icon" k="star" s="13" f="{{true}}" hint-size="13px,13px"></dc-import>
              <dc-import name="Icon" k="star" s="13" f="{{true}}" hint-size="13px,13px"></dc-import>
              <dc-import name="Icon" k="star" s="13" f="{{true}}" hint-size="13px,13px"></dc-import>
              <dc-import name="Icon" k="star" s="13" f="{{true}}" hint-size="13px,13px"></dc-import>
            </div>
          </div>
          <span class="mut" style="font-size:13px">Hoy</span>
        </div>
        <p style="font-size:15px;line-height:1.5">{{r.text}}</p>
      </article>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 20px 36px;background:linear-gradient(to top,#FAFAFC 70%,rgba(250,250,252,0))">
    <button class="btn bp" style="width:100%"><dc-import name="Icon" k="edit" s="20" hint-size="20px,20px"></dc-import>Escribir una reseña</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      reviews: [
        { ini: 'C', who: 'Cliente', bg: '#FDE6F2', fg: '#C2338F', text: 'El montaje de nuestra boda superó todas las expectativas. Las sillas Tiffany y el arco floral quedaron de revista.' },
        { ini: 'C', who: 'Cliente', bg: '#EFE8FD', fg: '#7A4FD8', text: 'Puntualidad impecable y atención personalizada con Rosa IA. ¡Recomendados 100%!' }
      ]
    };
  }
}
</script>
</body>
</html>
