<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historial de cotizaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .mut{color:#62627A}
.rf .tag{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:700;white-space:nowrap}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:16px">
    <header style="display:flex;align-items:center;gap:12px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <h1 class="d" style="font-size:20px;font-weight:800;flex:1">Cotizaciones</h1>
    </header>
    <sc-for list="{{quotes}}" as="q" hint-placeholder-count="3">
      <button style="width:100%;border-radius:22px;background:#fff;box-shadow:0 0 0 1px #F2EDF5;padding:16px 18px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%">
          <div style="min-width:0">
            <p class="one" style="font-size:16px;font-weight:700">{{q.name}}</p>
            <p class="mut" style="font-size:13px">{{q.date}} · {{q.place}}</p>
          </div>
          <span class="tag" style="background:{{q.sbg}};color:{{q.sfg}}">{{q.status}}</span>
        </div>
        <div style="width:100%;display:flex;flex-direction:column;gap:6px">
          <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:4px">
            <sc-for list="{{q.segs}}" as="s" hint-placeholder-count="5"><span style="height:6px;border-radius:3px;background:{{s}}"></span></sc-for>
          </div>
          <p class="mut" style="font-size:12px;font-weight:600">Paso {{q.step}} de 5 · {{q.stepName}}</p>
        </div>
        <div style="display:flex;gap:16px;font-size:14px;width:100%">
          <span style="display:flex;align-items:center;gap:6px" class="mut"><dc-import name="Icon" k="users" s="16" hint-size="16px,16px"></dc-import>{{q.guests}}</span>
          <span class="d" style="margin-left:auto;font-size:17px;font-weight:800">RD$ {{q.total}}</span>
        </div>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Solicitada', 'Revisada', 'Confirmada', 'Pagada', 'Completada'];
    const mk = (o) => {
      const segs = [0, 1, 2, 3, 4].map((i) => (i < o.step ? o.c : '#F1EFF5'));
      return { ...o, segs, stepName: names[o.step - 1] };
    };
    return {
      quotes: [
        mk({ name: 'Boda Real Rosa & Dorado', date: 'Vie 23 oct', place: 'Jardín Botánico', status: 'Revisada', sbg: '#FFF2C9', sfg: '#7A5700', c: '#F7B500', step: 2, guests: '120 invitados', total: '4,500' }),
        mk({ name: 'Quinceañera Valentina Crystal', date: 'Lun 2 nov', place: 'Hotel El Embajador', status: 'Confirmada', sbg: '#EEF6D6', sfg: '#4E6A10', c: '#8DB52C', step: 3, guests: '150 invitados', total: '6,200' }),
        mk({ name: 'Gala Corporativa Grupo Caribe', date: 'Lun 12 oct', place: 'JW Marriott BlueMall', status: 'Completada', sbg: '#EFE8FD', sfg: '#7A4FD8', c: '#865DEC', step: 5, guests: '200 invitados', total: '8,500' })
      ]
    };
  }
}
</script>
</body>
</html>
