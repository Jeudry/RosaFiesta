<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Título A · Degradado y garabato</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf .gt{background:linear-gradient(90deg,#EA4EA9,#865DEC);-webkit-background-clip:text;background-clip:text;color:transparent}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf input{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .card{background:#fff;border-radius:20px;box-shadow:0 0 0 1px #F2EDF5,0 14px 30px -20px rgba(200,80,170,.45)}
.rf .mut{color:#62627A}
.rf .fld{height:52px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -16px rgba(180,80,180,.4);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;color:#62627A}
.rf .chip{height:38px;padding:0 15px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#F1EFF5;white-space:nowrap;flex:none}
.rf .on{background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;box-shadow:0 8px 18px -8px rgba(134,93,236,.7)}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 35% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 30% at 100% 10%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:54px 20px 0;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:flex-end;gap:10px">
      <div style="flex:1;position:relative;height:52px">
        <h1 class="d" style="font-size:38px;font-weight:800;line-height:1;display:inline-block;background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 55%,#865DEC 100%);-webkit-background-clip:text;background-clip:text;color:transparent">Catálogo</h1>
        <svg aria-hidden="true" width="170" height="16" viewBox="0 0 170 16" style="position:absolute;left:0;top:38px"><path d="M4 10C22 4 38 4 54 9S88 14 106 8 144 3 166 9" stroke="#FBCA3F" stroke-width="4.5" stroke-linecap="round" fill="none"></path></svg>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" style="position:absolute;left:170px;top:-6px"><path d="M10 0l2.6 7.4L20 10l-7.4 2.6L10 20l-2.6-7.4L0 10l7.4-2.6z" fill="#B9D84A"></path></svg>
        <span style="position:absolute;left:186px;top:14px;width:6px;height:6px;border-radius:50%;background:#EA4EA9"></span>
      </div>
      <button class="ib" aria-label="Vista de cuadrícula"><dc-import name="Icon" k="grid" s="20" hint-size="20px,20px"></dc-import></button>
      <button class="ib" aria-label="Mi evento, 16 artículos" style="position:relative"><dc-import name="Icon" k="party" s="20" hint-size="20px,20px"></dc-import><span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:#FFD45C;color:#2E1A47;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px">16</span></button>
    </div>
    <label class="fld">
      <dc-import name="Icon" k="search" s="20" hint-size="20px,20px"></dc-import>
      <input placeholder="Buscar sillas, mesas, flores…" aria-label="Buscar en el catálogo">
      <button aria-label="Buscar por voz" style="width:40px;height:40px;border-radius:12px;background:#F5EAF9;color:#B54BD6;display:grid;place-items:center"><dc-import name="Icon" k="mic" s="20" hint-size="20px,20px"></dc-import></button>
    </label>
    <div style="display:flex;gap:8px;margin:0 -20px;padding:0 20px;overflow:hidden">
      <button class="chip on">Todas · 15</button>
      <button class="chip">Iluminación</button>
      <button class="chip">Floral</button>
      <button class="chip">Globos</button>
      <button class="chip">Mobiliario</button>
    </div>
    <button style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:linear-gradient(90deg,#FCE6F3,#ECE4FD);width:100%">
      <dc-import name="Rosa" s="36" glow="{{false}}" hint-size="36px,36px"></dc-import>
      <span style="flex:1;font-size:14px;line-height:1.35"><b>¿No sabes por dónde empezar?</b><br><span class="mut">Rosa arma tu lista en 2 minutos.</span></span>
      <span style="color:#865DEC"><dc-import name="Icon" k="chev-r" s="20" hint-size="20px,20px"></dc-import></span>
    </button>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <article class="card" style="overflow:hidden">
          <div style="height:128px;background:{{it.bg}};position:relative;display:grid;place-items:center">
            <dc-import name="Illo" k="{{it.k}}" w="104" h="104" hint-size="104px,104px"></dc-import>
            <sc-if value="{{it.nuevo}}" hint-placeholder-val="{{false}}"><span style="position:absolute;left:8px;top:8px;height:24px;padding:0 9px;border-radius:999px;background:#FFD45C;color:#2E1A47;font-size:12px;font-weight:800;display:flex;align-items:center">Nuevo</span></sc-if>
            <button aria-label="Guardar en favoritos" style="position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#EA4EA9"><dc-import name="Icon" k="heart" s="18" hint-size="18px,18px"></dc-import></button>
          </div>
          <div style="padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:3px">
            <p class="one" style="font-size:15px;font-weight:700">{{it.name}}</p>
            <p class="one mut" style="font-size:13px">{{it.desc}}</p>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
              <p><span class="d gt" style="font-size:21px;font-weight:800">{{it.price}}</span> <span style="font-size:11px;font-weight:700;color:#B54BD6">RD$/día</span></p>
              <button aria-label="Agregar a mi evento" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(134,93,236,.8)"><dc-import name="Icon" k="plus" s="18" w="2.2" hint-size="18px,18px"></dc-import></button>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
  <div style="position:absolute;left:0;bottom:0">
    <dc-import name="TabBar" a="catalogo" cl="{{true}}" hint-size="390px,96px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Neón LED personalizado', desc: 'Letrero neón con tu nombre', price: '65', k: 'neon', bg: '#1E1A2E', nuevo: true },
        { name: 'Mesa dulce temática', desc: 'Decoración completa para dulces', price: '150', k: 'dulce', bg: '#EEF6D6', nuevo: false },
        { name: 'Arco de globos', desc: 'Rosa y azul, para la entrada', price: '95', k: 'arcolg', bg: '#FDE6F2', nuevo: false },
        { name: 'Candelabros de cristal', desc: 'Altos, para mesa principal', price: '12', k: 'candelabro', bg: '#FFF2C9', nuevo: false }
      ]
    };
  }
}
</script>
</body>
</html>
