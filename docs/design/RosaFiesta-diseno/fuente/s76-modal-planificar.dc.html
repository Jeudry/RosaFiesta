<style>

.rf,.rf *{box-sizing:border-box}

.rf .op{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px #EEE9F2;width:100%;min-height:84px}
.rf .tag{height:22px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;font-size:11px;font-weight:700;margin-left:6px;vertical-align:2px}
</style>

<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">

    <span style="align-self:center;width:40px;height:5px;border-radius:3px;background:#E3DCE8"></span>
    <div style="padding:0 4px">
      <h2 class="d" style="font-size:22px;font-weight:800;line-height:1.1">¿Cómo quieres planificar?</h2>
      <p class="mut" style="font-size:15px;margin-top:4px">Elige cómo prefieres hablar con nosotros.</p>
    </div>
    <button class="op">
      <span style="width:52px;height:52px;border-radius:16px;background:#EEF6D6;color:#4E6A10;display:grid;place-items:center;flex:none"><dc-import name="Icon" k="wa" s="26" hint-size="26px,26px"></dc-import></span>
      <span style="flex:1"><span style="display:block;font-size:16px;font-weight:700">WhatsApp con María</span><span class="mut" style="font-size:14px">Habla directo con la dueña</span></span>
      <span class="mut"><dc-import name="Icon" k="chev-r" s="20" hint-size="20px,20px"></dc-import></span>
    </button>
    <button class="op" style="box-shadow:inset 0 0 0 2px #865DEC;background:#FAF8FF">
      <dc-import name="Rosa" s="52" glow="{{false}}" hint-size="52px,52px"></dc-import>

      <span style="color:#7A4FD8"><dc-import name="Icon" k="chev-r" s="20" hint-size="20px,20px"></dc-import></span>
    </button>
    <button class="op">
      <span style="width:52px;height:52px;border-radius:16px;background:#FFF2C9;color:#7A5700;display:grid;place-items:center;flex:none"><dc-import name="Icon" k="wave" s="26" hint-size="26px,26px"></dc-import></span>
