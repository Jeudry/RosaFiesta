<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf input{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1}
.rf input::placeholder{color:#62627A}
.rf .mut{color:#62627A}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf .me{align-self:flex-end;max-width:290px;background:linear-gradient(135deg,#EA4EA9,#865DEC);color:#fff;border-radius:20px 20px 6px 20px;padding:12px 14px 8px;font-size:15px;line-height:1.45}
.rf .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:#FFD6E8;margin-top:4px}
.rf .div{align-self:center;font-size:12px;font-weight:700;color:#62627A;padding:4px 10px;border-radius:999px;background:#F1EFF5}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">

    <button aria-label="Volver" style="width:44px;height:44px;display:grid;place-items:center"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
    <dc-import name="Logo" s="42" hint-size="42px,42px"></dc-import>
    <div style="flex:1;min-width:0">
      <h1 class="one" style="font-size:16px;font-weight:700">Equipo Rosa Fiesta</h1>
      <p style="font-size:12px;color:#4E6A10;display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:#8DB52C"></span>En línea</p>
    </div>
    <button aria-label="Más opciones" style="width:44px;height:44px;display:grid;place-items:center"><dc-import name="Icon" k="more-v" s="22" w="2.6" hint-size="22px,22px"></dc-import></button>
  </header>

  <div style="position:absolute;top:126px;left:16px;right:16px;display:flex;flex-direction:column;gap:10px">
    <button style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #F2EDF5;width:100%">
      <dc-import name="Foto" k="boda" w="48" h="48" r="12" pos="center 30%" hint-size="48px,48px"></dc-import>
      <span style="flex:1;min-width:0"><span class="one" style="display:block;font-size:14px;font-weight:700">Boda Real Rosa &amp; Dorado</span><span class="mut" style="font-size:12px">Vie 23 oct · 120 invitados</span></span>
      <span style="font-size:13px;font-weight:700;color:#C2338F;padding:0 6px">Ver</span>
    </button>
    <span class="div" style="margin-top:10px">Ayer</span>
    <div class="me">¡Hola equipo Rosa Fiesta! ¿Podemos incluir 20 sillas Chiavari doradas adicionales para el área del brindis?<p class="meta">7:38 p. m. <dc-import name="Icon" k="check" s="14" w="2.2" hint-size="14px,14px"></dc-import></p></div>
    <div class="me">Ya revisé el presupuesto ajustado y el montaje en el Jardín Botánico nos encanta.<p class="meta">9:08 p. m. <dc-import name="Icon" k="check" s="14" w="2.2" hint-size="14px,14px"></dc-import></p></div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:10px 12px 30px;background:#fff;box-shadow:0 -1px 0 #F2EDF5;display:flex;align-items:center;gap:8px">
    <button aria-label="Emojis" style="width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#62627A"><dc-import name="Icon" k="smile" s="22" hint-size="22px,22px"></dc-import></button>
    <label style="flex:1;min-width:0;height:48px;border-radius:999px;background:#F5F0F3;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px"><input placeholder="Escribe un mensaje…" aria-label="Mensaje" style="min-width:0;width:100%;flex:1;border:0;outline:0;background:none;font:inherit"><button aria-label="Adjuntar foto" style="width:38px;height:38px;display:grid;place-items:center;color:#62627A"><dc-import name="Icon" k="camera" s="20" hint-size="20px,20px"></dc-import></button></label>
    <button aria-label="Enviar" style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#EA4EA9,#865DEC);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(160,80,210,.7)"><dc-import name="Icon" k="send" s="20" hint-size="20px,20px"></dc-import></button>
  </div>
</div>
</x-dc>
