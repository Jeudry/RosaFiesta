<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tienda de globos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .card{background:#fff;border-radius:20px;box-shadow:0 0 0 1px #F2EDF5,0 12px 28px -20px rgba(200,80,170,.4)}
.rf .mut{color:#62627A}
.rf .chip{height:38px;padding:0 15px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:#fff;box-shadow:0 0 0 1px #EEE9F2;white-space:nowrap;flex:none}
.rf .on{background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;box-shadow:0 8px 18px -8px rgba(134,93,236,.7)}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:54px 20px 0;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <p class="mut" style="font-size:13px">Tienda</p>
        <h1 class="d" style="font-size:26px;font-weight:800;line-height:1">Globos</h1>
      </div>
      <button class="ib" aria-label="Buscar"><dc-import name="Icon" k="search" s="20" hint-size="20px,20px"></dc-import></button>
      <button aria-label="Carrito, 3 artículos" style="height:44px;border-radius:999px;padding:0 10px 0 12px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 16px -8px rgba(134,93,236,.7)">
        <dc-import name="Icon" k="bag" s="20" hint-size="20px,20px"></dc-import>
        <span style="min-width:24px;height:24px;border-radius:999px;background:#FFD45C;font-size:12px;display:grid;place-items:center;padding:0 7px;color:#2E1A47;font-weight:800">3</span>
      </button>
    </div>
    <div style="display:flex;gap:8px;margin:0 -20px -18px;padding:2px 20px 14px;overflow:hidden">
      <button class="chip on">Todos</button>
      <button class="chip">Metalizados</button>
      <button class="chip">Látex</button>
      <button class="chip">Bouquets</button>
    </div>
    <section style="height:164px;border-radius:24px;background:#EFE8FD;position:relative;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="position:absolute;right:-6px;top:4px"><dc-import name="Illo" k="pastelset" w="170" h="170" hint-size="170px,170px"></dc-import></div>
      <div style="position:relative;display:flex;flex-direction:column;gap:6px;max-width:190px">
        <span style="align-self:flex-start;height:24px;padding:0 9px;border-radius:999px;background:#fff;color:#7A4FD8;font-size:12px;font-weight:700;display:flex;align-items:center">Nuevo</span>
        <h2 class="d" style="font-size:21px;font-weight:800;line-height:1.05">Colección Pastel Dream</h2>
      </div>
      <button style="position:relative;align-self:flex-start;height:42px;padding:0 16px;border-radius:999px;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 16px -8px rgba(134,93,236,.7)">Ver colección</button>
    </section>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2 class="d" style="font-size:20px;font-weight:800">Favoritos de la fiesta</h2>
      <button style="height:32px;font-size:14px;font-weight:700;color:#C2338F">Ver todo</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <article class="card" style="overflow:hidden">
          <div style="height:128px;background:{{it.bg}};position:relative;display:grid;place-items:center">
            <dc-import name="Illo" k="{{it.k}}" w="108" h="108" hint-size="108px,108px"></dc-import>
            <sc-if value="{{it.sale}}" hint-placeholder-val="{{false}}"><span style="position:absolute;left:10px;top:10px;height:24px;padding:0 9px;border-radius:999px;background:linear-gradient(135deg,#EA4EA9,#865DEC);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;box-shadow:0 8px 16px -8px rgba(160,80,210,.7)">Oferta</span></sc-if>
            <button aria-label="Guardar en favoritos" style="position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:{{it.hc}}"><dc-import name="Icon" k="heart" s="18" f="{{it.fav}}" hint-size="18px,18px"></dc-import></button>
          </div>
          <div style="padding:12px 12px 12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px">
            <div style="min-width:0">
              <p class="one" style="font-size:15px;font-weight:700">{{it.name}}</p>
              <p class="d" style="font-size:17px;font-weight:800">RD$ {{it.price}}</p>
            </div>
            <button aria-label="Agregar al carrito" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 16px -8px rgba(134,93,236,.7)"><dc-import name="Icon" k="plus" s="18" w="2.2" hint-size="18px,18px"></dc-import></button>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
  <div style="position:absolute;left:0;bottom:0">
    <dc-import name="TabBar" cl="{{true}}" a="catalogo" hint-size="390px,96px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Estrella dorada', price: '5.99', k: 'foil', bg: '#FFF2C9', fav: true, hc: '#D63F98', sale: false },
        { name: 'Set rosa pastel', price: '3.50', k: 'pastelset', bg: '#FDE6F2', fav: false, hc: '#1A1A2E', sale: true },
        { name: 'Bouquet tricolor', price: '[precio]', k: 'globos', bg: '#DDF4F3', fav: false, hc: '#1A1A2E', sale: false },
        { name: 'Arco orgánico', price: '[precio]', k: 'arco', bg: '#EEF6D6', fav: false, hc: '#1A1A2E', sale: false }
      ]
    };
  }
}
</script>
</body>
</html>
