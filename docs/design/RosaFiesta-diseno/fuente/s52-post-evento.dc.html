<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Análisis post-evento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .mut{color:#62627A}
.rf .card{background:#fff;border-radius:22px;box-shadow:0 0 0 1px #F2EDF5}
.rf .btn{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}
.rf .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:14px">
    <header style="display:flex;align-items:center;gap:12px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <div style="flex:1;min-width:0"><h1 class="d" style="font-size:20px;font-weight:800;line-height:1.1">Así salió tu evento</h1><p class="mut one" style="font-size:13px">Gala Corporativa Grupo Caribe · 12 oct</p></div>
    </header>

    <section style="border-radius:24px;background:#EFE8FD;padding:20px;display:flex;align-items:center;gap:18px">
      <svg role="img" aria-label="Puntualidad 100%" width="96" height="96" viewBox="0 0 96 96" style="flex:none">
        <circle cx="48" cy="48" r="38" fill="none" stroke="#fff" stroke-width="10"></circle>
        <circle cx="48" cy="48" r="38" fill="none" stroke="#8DB52C" stroke-width="10" stroke-linecap="round"></circle>
        <path d="M36 49l8 8 16-17" stroke="#4E6A10" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div>
        <p style="font-size:13px;font-weight:700;color:#7A4FD8">Puntualidad</p>
        <p class="d" style="font-size:44px;font-weight:800;line-height:1">100%</p>
        <p class="mut" style="font-size:13px;margin-top:4px">Todo llegó a tiempo</p>
      </div>
    </section>

    <section class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:14px">
      <p style="font-size:15px;font-weight:700">Presupuesto</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mut">Estimado</span><b>RD$ 8,500</b></div>
        <div style="height:10px;border-radius:5px;background:#E6DEEA"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:14px"><span class="mut">Real</span><b>RD$ 8,535</b></div>
        <div style="height:10px;border-radius:5px;background:#F3F1F6"><span style="display:block;width:100%;min-width:10px;height:100%;border-radius:5px;background:#8DB52C"></span></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:#EEF6D6"><span style="font-size:14px;font-weight:600;color:#4E6A10">Cargo por un centro dañado</span><span class="d" style="font-size:20px;font-weight:800;color:#4E6A10;white-space:nowrap">RD$ 35</span></div>
    </section>

    <section class="card" style="padding:4px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px"><span style="font-size:15px;font-weight:600">Tareas completadas</span><span class="mut" style="font-size:14px">Sin tareas</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;box-shadow:0 -1px 0 #F2F0F5"><span style="font-size:15px;font-weight:600">Cronograma ejecutado</span><span class="mut" style="font-size:14px">Sin actividades</span></div>
    </section>
  </div>
  <div style="position:absolute;left:20px;right:20px;bottom:36px;display:flex;flex-direction:column;gap:6px">
    <button class="btn" style="background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7)"><dc-import name="Icon" k="star" s="20" hint-size="20px,20px"></dc-import>Dejar una reseña</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
