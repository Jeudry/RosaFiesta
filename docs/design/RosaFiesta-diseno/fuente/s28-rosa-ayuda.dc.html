<html lang="es">
<head>
<meta charset="utf-8">
<title>Rosa · ¿Te ayudo?</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2,.rf h3{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf input{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1}
.rf input::placeholder{color:#62627A}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .mut{color:#62627A}
.rf .seg{height:5px;border-radius:3px;flex:1}
.rf .me{align-self:flex-end;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 16px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.rf .opt{height:64px;border-radius:20px;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:17px;font-weight:700;width:100%}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:linear-gradient(180deg,#DED5F7 0%,#F2EAF7 40%,#F5EEF7 60%,#D9D0F2 100%)">
  <header style="position:absolute;top:54px;left:16px;right:16px;display:flex;align-items:center;gap:12px">
    <button class="ib" aria-label="Cerrar asistente"><dc-import name="Icon" k="chev-d" s="22" hint-size="22px,22px"></dc-import></button>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
      <p style="font-size:13px;font-weight:700">Paso 2 de 6</p>
      <div style="width:150px;display:flex;gap:4px">
        <span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:linear-gradient(90deg,#EA4EA9,#B754CB)"></span><span class="seg" style="background:#DDD3F3"></span><span class="seg" style="background:#DDD3F3"></span><span class="seg" style="background:#DDD3F3"></span><span class="seg" style="background:#DDD3F3"></span>
      </div>
    </div>
    <button class="ib" aria-label="Mi evento, 16 artículos" style="position:relative"><dc-import name="Icon" k="bag" s="22" hint-size="22px,22px"></dc-import><span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:#FFD45C;color:#2E1A47;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px">16</span></button>
  </header>

  <div style="position:absolute;top:128px;left:20px;right:20px;display:flex;flex-direction:column;gap:22px">
    <p class="me"><dc-import name="Icon" k="ring" s="18" hint-size="18px,18px"></dc-import>Boda</p>
    <div style="display:flex;flex-direction:column;gap:12px">
      <dc-import name="Rosa" s="40" glow="{{false}}" hint-size="40px,40px"></dc-import>
      <h1 class="d" style="font-size:26px;font-weight:800;line-height:1.05">¿Te ayudo a elegir los artículos de alquiler?</h1>
      <p class="mut" style="font-size:16px;line-height:1.5">Te recomiendo según tu boda. Puedes cambiar todo después.</p>
    </div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:116px;display:flex;flex-direction:column;gap:10px">
    <button class="opt" style="background:linear-gradient(135deg,#EA4EA9,#865DEC);color:#fff;box-shadow:0 8px 16px -8px rgba(160,80,210,.7)"><dc-import name="Icon" k="sparkle" s="22" hint-size="22px,22px"></dc-import><span style="flex:1">Sí, busquemos juntas</span><dc-import name="Icon" k="next" s="20" hint-size="20px,20px"></dc-import></button>
    <button class="opt" style="background:#fff"><dc-import name="Icon" k="store" s="22" hint-size="22px,22px"></dc-import><span style="flex:1">No, prefiero ver el catálogo</span></button>
  </div>

  <label style="position:absolute;left:16px;right:16px;bottom:34px;height:58px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px #E7DEF5,0 12px 30px -20px rgba(170,70,160,.4);display:flex;align-items:center;gap:10px;padding:0 6px 0 20px">
    <input placeholder="Escríbele a Rosa o habla…" aria-label="Mensaje para Rosa">
    <button aria-label="Hablar con Rosa" style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(134,93,236,.7)"><dc-import name="Icon" k="mic" s="22" hint-size="22px,22px"></dc-import></button>
  </label>
</div>
</x-dc>
