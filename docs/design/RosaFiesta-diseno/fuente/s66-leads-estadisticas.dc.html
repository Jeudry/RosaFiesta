<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Leads · Estadísticas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#151729;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #ECECF5,0 8px 20px -14px rgba(70,80,180,.4);flex:none;color:#151729}
.rf .mut{color:#5F6377}
.rf .tab{height:44px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#5F6377;white-space:nowrap;flex:none;text-decoration:none}
.rf .tab.on{color:#151729;font-weight:700;box-shadow:inset 0 -2.5px 0 #5B6CF0}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 100% 0%,#E6E7FF 0%,rgba(230,231,255,0) 60%),radial-gradient(80% 35% at 0% 12%,#F1E9FB 0%,rgba(241,233,251,0) 60%),#F6F6FB">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:12px">
    <header style="display:flex;align-items:center;gap:10px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <h1 class="d" style="font-size:20px;font-weight:800;flex:1">Leads</h1>
      <button class="ib" aria-label="Actualizar"><dc-import name="Icon" k="refresh" s="20" hint-size="20px,20px"></dc-import></button>
    </header>
    <nav style="display:flex;gap:22px;box-shadow:inset 0 -1px 0 #E9E9F2;margin:0 -20px;padding:0 20px">
      <a class="tab" href="s64-leads-pipeline.dc.html">Pipeline</a>
      <a class="tab" href="s65-leads-seguimientos.dc.html">Seguimientos</a>
      <a class="tab on" href="s66-leads-estadisticas.dc.html">Estadísticas</a>
    </nav>
    <section style="margin-top:6px;border-radius:24px;background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 55%,#2FB8C8 100%);color:#fff;padding:20px;display:flex;align-items:flex-end;justify-content:space-between;box-shadow:0 18px 34px -20px rgba(80,110,230,.75)">
      <div>
        <p style="font-size:13px;color:#F6EAFB">Tasa de conversión</p>
        <p class="d" style="font-size:46px;font-weight:800;line-height:1;margin-top:8px">33.3%</p>
      </div>
      <p style="font-size:14px;color:#F6EAFB;text-align:right">1 de 3 leads<br>ganados</p>
    </section>
    <section style="border-radius:22px;background:#fff;box-shadow:0 0 0 1px #ECECF5;padding:18px;display:flex;flex-direction:column;gap:14px">
      <p style="font-size:15px;font-weight:700">Embudo</p>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between;font-size:14px"><span style="font-weight:600">{{r.name}}</span><span class="d" style="font-weight:800">{{r.n}}</span></div>
          <div style="height:12px;border-radius:6px;background:#F3F1F6"><span style="display:block;height:100%;border-radius:6px;width:{{r.w}};background:{{r.c}}"></span></div>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (name, n, c) => ({ name, n, c, w: n === 0 ? '0%' : Math.round((n / 3) * 100) + '%' });
    return {
      rows: [
        mk('Total', 3, '#865DEC'),
        mk('Nuevos', 1, '#1FBDC0'),
        mk('Calificados', 0, '#865DEC'),
        mk('Ganados', 1, '#8DB52C'),
        mk('Perdidos', 0, '#B42345')
      ]
    };
  }
}
</script>
</body>
</html>
