<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bot de WhatsApp · Conversaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#151729;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #ECECF5,0 8px 20px -14px rgba(70,80,180,.4);flex:none;color:#151729}
.rf .mut{color:#5F6377}
.rf .tab{height:44px;display:flex;align-items:center;font-size:15px;font-weight:600;color:#5F6377;white-space:nowrap;flex:none;text-decoration:none}
.rf .tab.on{color:#151729;font-weight:700;box-shadow:inset 0 -2.5px 0 #5B6CF0}
.rf .tag{height:22px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;font-size:11px;font-weight:700;white-space:nowrap}
.rf .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</helmet>
<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 100% 0%,#E6E7FF 0%,rgba(230,231,255,0) 60%),radial-gradient(80% 35% at 0% 12%,#F1E9FB 0%,rgba(241,233,251,0) 60%),#F6F6FB">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:12px">
    <header style="display:flex;align-items:center;gap:10px">
      <button class="ib" aria-label="Volver"><dc-import name="Icon" k="back" s="22" hint-size="22px,22px"></dc-import></button>
      <div style="flex:1"><h1 class="d" style="font-size:20px;font-weight:800;line-height:1.1">Bot de WhatsApp</h1><p style="font-size:12px;font-weight:700;color:#4E6A10;display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:#8DB52C"></span>Activo</p></div>
      <button class="ib" aria-label="Buscar"><dc-import name="Icon" k="search" s="20" hint-size="20px,20px"></dc-import></button>
    </header>
    <nav style="display:flex;gap:20px;box-shadow:inset 0 -1px 0 #E9E9F2;margin:0 -20px;padding:0 20px">
      <a class="tab" href="s72-bot-preguntas.dc.html">Preguntas</a>
      <a class="tab" href="s73-bot-palabras.dc.html">Palabras clave</a>
      <a class="tab on" href="s74-bot-conversaciones.dc.html">Chats</a>
    </nav>
    <section style="border-radius:22px;background:#fff;box-shadow:0 0 0 1px #ECECF5;margin-top:4px">
      <sc-for list="{{chats}}" as="c" hint-placeholder-count="3">
        <button style="width:100%;display:flex;gap:12px;padding:14px 16px;box-shadow:{{c.line}};align-items:flex-start">
          <span style="width:44px;height:44px;border-radius:50%;background:{{c.bg}};color:{{c.fg}};display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;position:relative">{{c.ini}}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="display:flex;align-items:baseline;gap:8px"><span style="flex:1;font-size:15px;font-weight:700">{{c.name}}</span><span class="mut" style="font-size:12px">{{c.time}}</span></span>
            <span class="mut clamp" style="font-size:14px;line-height:1.4;color:{{c.tc}}">{{c.msg}}</span>
            <span style="display:flex;align-items:center;gap:8px;margin-top:3px"><span class="tag" style="background:{{c.sbg}};color:{{c.sfg}}">{{c.status}}</span><span class="mut" style="font-size:12px">{{c.phone}}</span></span>
          </span>
        </button>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const l = '0 -1px 0 #F0F0F6';
    const done = { status: 'Resuelta', sbg: '#EEF6D6', sfg: '#4E6A10', tc: '#5F6377' };
    const pend = { status: 'Pendiente', sbg: '#FFF2C9', sfg: '#7A5700', tc: '#151729' };
    return {
      chats: [
        { ...pend, ini: 'VS', name: 'Valeria Santos', time: '8:46 a. m.', phone: '+1 829 555 0198', msg: 'Hola, ¿tienen disponibilidad de sillas Tiffany doradas para el 24 de octubre?', bg: '#ECEBFF', fg: '#4B47D6', line: 'none' },
        { ...done, ini: 'CR', name: 'Camila Rodríguez', time: '11:46 a. m.', phone: '+1 809 555 0142', msg: '¡Perfecto! Quisiera agendar la visita para ver el arco orgánico doble.', bg: '#EFE8FD', fg: '#7A4FD8', line: l },
        { ...done, ini: 'AM', name: 'Andrés Mejía', time: 'Ayer', phone: '+1 849 555 0271', msg: 'Muchas gracias por enviarme la cotización actualizada del paquete VIP.', bg: '#DDF4F3', fg: '#1F8A84', line: l }
      ]
    };
  }
}
</script>
</body>
</html>
