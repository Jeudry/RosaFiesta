<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>50 · Pago</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E9EF;display:flex;justify-content:center;padding:24px 0}
#screen{position:relative;overflow:hidden;width:390px;height:844px;box-shadow:0 20px 60px -20px rgba(0,0,0,.35)}

body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1,.rf h2{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf input{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1;width:100%}
.rf input::placeholder{color:#62627A}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .mut{color:#62627A}
.rf .h{font-size:15px;font-weight:700}
.rf .pm{height:62px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #EEE9F2;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;font-weight:600}
.rf .fld{height:52px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #E8E1EE,0 8px 20px -16px rgba(180,80,180,.35);display:flex;align-items:center;gap:10px;padding:0 14px;color:#62627A}


body{margin:0}

</style>
</head>
<body>
<!-- 50 · Pago · Exportado del lienzo de Claude Design (HTML estático, sin lógica). -->
<div id="screen">


<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:14px">
    <header style="display:flex;align-items:center;gap:12px">
      <button class="ib" aria-label="Volver">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
</button>
      <h1 class="d" style="font-size:20px;font-weight:800;flex:1">Pago</h1>
      <span class="mut" style="font-size:13px;display:flex;align-items:center;gap:4px">

<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 11.5A1.5 1.5 0 0 1 6.5 10h11a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5zM8 10V7a4 4 0 0 1 8 0v3"></path></svg>
Pago seguro</span>
    </header>
    <section style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #F2EDF5">
      <span style="width:40px;height:40px;border-radius:12px;background:#EEF6D6;color:#4E6A10;display:grid;place-items:center;flex:none">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M2 6h11v10H2zM13 9h4.5l3.5 3.5V16h-8M4.5 18.5a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0M15.5 18.5a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0"></path></svg>
</span>
      <div style="flex:1;min-width:0"><p class="mut" style="font-size:12px">Entrega para Camila Rodríguez</p><p style="font-size:15px;font-weight:700">Jardín Botánico Santo Domingo</p></div>
      <button style="font-size:14px;font-weight:700;color:#C2338F;height:40px">Cambiar</button>
    </section>
    <p class="h" style="margin-top:4px">Método de pago</p>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
      <button class="pm" style="box-shadow:inset 0 0 0 2px #B754CB">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zM3 10h18M7 15h3"></path></svg>
Tarjeta<span style="margin-left:auto;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#E04FAF 0%,#945AE1 55%,#6664E9 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(134,93,236,.7)">

<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span></button>
      <button class="pm">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M3 9.5L12 4l9 5.5M4 20h16M6 10.5v6.5M10 10.5v6.5M14 10.5v6.5M18 10.5v6.5"></path></svg>
Banco Popular</button>
      <button class="pm">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M3 9.5L12 4l9 5.5M4 20h16M6 10.5v6.5M10 10.5v6.5M14 10.5v6.5M18 10.5v6.5"></path></svg>
Banreservas</button>
      <button class="pm">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M2 7h20v10H2zM9.5 12a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M5.5 10v4M18.5 10v4"></path></svg>
Efectivo</button>
    </div>
    <p class="h" style="margin-top:4px">Datos de la tarjeta</p>
    <label class="fld">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M8 8a4 4 0 1 0 8 0a4 4 0 1 0 -8 0M4 20c.8-3.6 4-6 8-6s7.2 2.4 8 6"></path></svg>
<input placeholder="Nombre en la tarjeta" value="Olivia Rhye" style="color: rgb(26, 26, 46);"></label>
    <label class="fld">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zM3 10h18M7 15h3"></path></svg>
<input placeholder="Número de tarjeta" inputmode="numeric" style=""></label>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
      <label class="fld"><input placeholder="MM/AA" aria-label="Vencimiento" style=""></label>
      <label class="fld"><input placeholder="CVC" aria-label="Código de seguridad" style=""></label>
    </div>
    <label class="fld">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 4h3.5l1.5 4.5-2.2 1.3a11 11 0 0 0 6.4 6.4l1.3-2.2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5C10.6 20 4 13.4 3.5 5.6A1.5 1.5 0 0 1 5 4z"></path></svg>
<input placeholder="Teléfono de contacto" value="(809) 555-1234" style="color: rgb(26, 26, 46);"></label>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;background:#fff;box-shadow:0 -1px 0 #F2EDF5">
    <button style="width:100%;height:58px;border-radius:16px;background:linear-gradient(90deg,#EA4EA9 0%,#B754CB 50%,#865DEC 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(200,70,180,.7);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 20px"><span>Pagar anticipo (30%)</span><span class="d" style="font-size:19px;font-weight:800">RD$ 1,350</span></button>
  </div>
</div>

</div>
</body>
</html>
