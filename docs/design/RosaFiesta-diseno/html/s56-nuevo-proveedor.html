<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>56 · Nuevo proveedor</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E9EF;display:flex;justify-content:center;padding:24px 0}
#screen{position:relative;overflow:hidden;width:390px;height:844px;box-shadow:0 20px 60px -20px rgba(0,0,0,.35)}

body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#151729;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf input,.rf textarea{font:inherit;color:inherit;border:0;outline:0;background:none;padding:0;min-width:0;flex:1;width:100%}
.rf input::placeholder,.rf textarea::placeholder{color:#5F6377}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #ECECF5,0 8px 20px -14px rgba(70,80,180,.4);flex:none;color:#151729}
.rf .f{display:flex;flex-direction:column;gap:6px}
.rf .l{font-size:14px;font-weight:600}
.rf .fld{height:50px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #E3E4EF,0 8px 20px -16px rgba(70,80,180,.35);display:flex;align-items:center;gap:10px;padding:0 14px;color:#5F6377}


body{margin:0}

</style>
</head>
<body>
<!-- 56 · Nuevo proveedor · Exportado del lienzo de Claude Design (HTML estático, sin lógica). -->
<div id="screen">


<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 100% 0%,#E6E7FF 0%,rgba(230,231,255,0) 60%),radial-gradient(80% 35% at 0% 12%,#F1E9FB 0%,rgba(241,233,251,0) 60%),#F6F6FB">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:14px">
    <header style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
      <button class="ib" aria-label="Cerrar">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M18 6L6 18M6 6l12 12"></path></svg>
</button>
      <h1 class="d" style="font-size:20px;font-weight:800;flex:1">Nuevo proveedor</h1>
    </header>
    <label class="f"><span class="l">Nombre de la empresa <span style="color:#4B47D6">*</span></span><span class="fld">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h15A1.5 1.5 0 0 1 21 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5zM9 7V5h6v2M3 13h18"></path></svg>
<input placeholder="Ej. Flores del Valle" style=""></span></label>
    <label class="f"><span class="l">Persona de contacto</span><span class="fld">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M8 8a4 4 0 1 0 8 0a4 4 0 1 0 -8 0M4 20c.8-3.6 4-6 8-6s7.2 2.4 8 6"></path></svg>
<input placeholder="Nombre y apellido" style=""></span></label>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
      <label class="f"><span class="l">Teléfono</span><span class="fld"><input placeholder="809 000 0000" inputmode="tel" style=""></span></label>
      <label class="f"><span class="l">Correo</span><span class="fld"><input placeholder="correo@…" inputmode="email" style=""></span></label>
    </div>
    <label class="f"><span class="l">Sitio web</span><span class="fld">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
<input placeholder="www.ejemplo.com" style=""></span></label>
    <label class="f"><span class="l">Notas</span><span class="fld" style="height:110px;align-items:flex-start;padding-top:14px"><textarea placeholder="Condiciones, horarios, lo que ofrece…" style="height: 80px; resize: none; color: rgb(21, 23, 41);"></textarea></span></label>
  </div>
  <div style="position:absolute;left:20px;right:20px;bottom:36px">
    <button style="width:100%;height:56px;border-radius:16px;background:linear-gradient(135deg,#7C5CF0 0%,#5B6CF0 100%);color:#fff;box-shadow:0 12px 26px -12px rgba(91,108,240,.7);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center">Guardar proveedor</button>
  </div>
</div>

</div>
</body>
</html>
