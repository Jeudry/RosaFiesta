<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>45 · Tareas</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E9EF;display:flex;justify-content:center;padding:24px 0}
#screen{position:relative;overflow:hidden;width:390px;height:844px;box-shadow:0 20px 60px -20px rgba(0,0,0,.35)}

body{margin:0}
.rf,.rf *{box-sizing:border-box}
.rf{font-family:'Figtree',system-ui,sans-serif;color:#1A1A2E;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.rf p,.rf h1{margin:0}
.rf .d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.rf button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
.rf .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px #F0EBF4,0 8px 20px -14px rgba(180,80,180,.4);flex:none;color:#1A1A2E}
.rf .mut{color:#62627A}
.rf .cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#62627A}
.rf .t{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;min-height:64px}
.rf .tag{height:24px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:700}


body{margin:0}

</style>
</head>
<body>
<!-- 45 · Tareas · Exportado del lienzo de Claude Design (HTML estático, sin lógica). -->
<div id="screen">


<div class="rf" style="width:390px;height:844px;background:radial-gradient(110% 40% at 0% 0%,#F9E3F1 0%,rgba(249,227,241,0) 60%),radial-gradient(80% 35% at 100% 15%,#EEE7FB 0%,rgba(238,231,251,0) 60%),#FAFAFC">
  <div style="padding:56px 20px 0;display:flex;flex-direction:column;gap:18px">
    <header style="display:flex;align-items:center;gap:12px">
      <button class="ib" aria-label="Volver">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
</button>
      <div style="flex:1">
        <h1 class="d" style="font-size:20px;font-weight:800;line-height:1.1">Tareas</h1>
        <p class="mut" style="font-size:13px">Boda Real Rosa &amp; Dorado</p>
      </div>
      <button aria-label="Nueva tarea" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#EA4EA9,#865DEC);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(160,80,210,.7)">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"></path></svg>
</button>
    </header>
    <section style="padding:16px 18px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px #F2EDF5;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><p class="d" style="font-size:26px;font-weight:800">2 <span class="mut" style="font-size:16px;font-weight:600">de 4 hechas</span></p><p style="font-size:14px;font-weight:700;color:#4E6A10">50%</p></div>
      <div style="height:8px;border-radius:4px;background:#F1EFF5"><span style="display:block;width:50%;height:100%;background:#8DB52C;border-radius:4px"></span></div>
    </section>

    <p class="cap">Pendientes</p>
    <section style="border-radius:22px;background:#fff;box-shadow:0 0 0 1px #F2EDF5;margin-top:-8px">
      <div class="t">
        <button aria-label="Marcar como hecha" style="width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px #CDBFCB;flex:none;margin-top:1px"></button>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px"><p style="font-size:16px;font-weight:600;line-height:1.3">Realizar pago inicial de reserva (30%)</p><span class="tag" style="background:#FFF2C9;color:#7A5700;align-self:flex-start">Vence hoy</span></div>
      </div>
      <div class="t" style="box-shadow:0 -1px 0 #F2F0F5">
        <button aria-label="Marcar como hecha" style="width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px #CDBFCB;flex:none;margin-top:1px"></button>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px"><p style="font-size:16px;font-weight:600;line-height:1.3">Inspección técnica de iluminación exterior</p><span class="tag" style="background:#F1EFF5;color:#62627A;align-self:flex-start">Mañana</span></div>
      </div>
    </section>

    <p class="cap">Completadas</p>
    <section style="border-radius:22px;background:#F7F3F6;margin-top:-8px">
      <div class="t">
        <button aria-label="Marcar como pendiente" style="width:26px;height:26px;border-radius:50%;background:#8DB52C;color:#fff;display:grid;place-items:center;flex:none;margin-top:1px">

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>
        <div style="flex:1"><p class="mut" style="font-size:16px;line-height:1.3;text-decoration:line-through">Confirmar paleta floral blanco y rosa pastel</p><p class="mut" style="font-size:13px;margin-top:4px">18 oct</p></div>
      </div>
      <div class="t" style="box-shadow:0 -1px 0 #EDE4EA">
        <button aria-label="Marcar como pendiente" style="width:26px;height:26px;border-radius:50%;background:#8DB52C;color:#fff;display:grid;place-items:center;flex:none;margin-top:1px">

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>
        <div style="flex:1"><p class="mut" style="font-size:16px;line-height:1.3;text-decoration:line-through">Aprobar plano de mesas imperial y sillas Tiffany</p><p class="mut" style="font-size:13px;margin-top:4px">19 oct</p></div>
      </div>
    </section>
  </div>
</div>

</div>
</body>
</html>
