# Cada módulo genera su propio paquete y solo consulta sus tablas (ver CLAUDE.md).
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/identity/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/identity/postgres/sqlcgen
        sql_package: pgx/v5
        emit_interface: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.int4
            go_type: int
  - engine: postgresql
